name: JioMart Daily Shipment Report

on:
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:

jobs:
  download-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies (Tesseract + Xvfb)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr xvfb

      - name: Install Python dependencies
        run: |
          pip install playwright pytesseract Pillow
          playwright install chromium
          playwright install-deps chromium

      - name: Run JioMart report downloader (via Xvfb virtual display)
        env:
          JIOMART_USER_ID:    ${{ secrets.JIOMART_USER_ID }}
          JIOMART_PASSWORD:   ${{ secrets.JIOMART_PASSWORD }}
          MS_CLIENT_ID:       ${{ secrets.MS_CLIENT_ID }}
          MS_TENANT_ID:       ${{ secrets.MS_TENANT_ID }}
          MS_CLIENT_SECRET:   ${{ secrets.MS_CLIENT_SECRET }}
          MS_REFRESH_TOKEN:   ${{ secrets.MS_REFRESH_TOKEN }}
        run: xvfb-run -a python jiomart_shipment_report.py

      - name: Upload debug screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: debug_screenshots/
          retention-days: 3
